name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: "django-insecure-ci-testing-key-for-github-actions"
      DEBUG: "False"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Static Code Analysis (Ruff Linter)
        run: |
          ruff check .

      - name: Check Django Configuration
        run: |
          python manage.py check

      - name: Check Missing Migrations
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Run Pytest
        run: |
          pytest -v

  docker-check:
    name: Validate Docker Build (Buildx & GHA Cache)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Validation with Cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: family-notes-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
